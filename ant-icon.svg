<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- background -->
  <rect width="128" height="128" rx="26" fill="#1a1207"/>
  <circle cx="64" cy="70" r="44" fill="#7aa744"/>
  <!-- red ant (right, small) -->
  <g transform="translate(78 72)">
    <ellipse cx="0" cy="0" rx="10" ry="8" fill="#d61f1f"/>
    <ellipse cx="-14" cy="0" rx="8" ry="7" fill="#d61f1f"/>
    <ellipse cx="-26" cy="0" rx="6" ry="6" fill="#ef4444"/>
    <path d="M-30,-4 L-36,-12 M-30,4 L-36,12" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8,-6 L-12,-14 M-2,-6 L-2,-14 M4,-5 L8,-12 M-8,6 L-12,14 M-2,6 L-2,14 M4,5 L8,12" stroke="#a00" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- black ant hero (left, big with crown) -->
  <g transform="translate(48 70)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="#111" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="-20" cy="0" rx="11" ry="10" fill="#111" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="-36" cy="0" rx="9" ry="9" fill="#000" stroke="#FFD700" stroke-width="1.5"/>
    <circle cx="-38" cy="-3" r="2" fill="#fff"/>
    <path d="M-42,-6 L-48,-16 M-38,-7 L-40,-17" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-10,-9 L-15,-20 M-2,-10 L-2,-21 M7,-8 L12,-18 M-10,9 L-15,20 M-2,10 L-2,21 M7,8 L12,18" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- crown -->
    <g transform="translate(-20 -22)">
      <polygon points="0,8 -10,-4 -5,8 0,-6 5,8 10,-4" fill="#FFD700" stroke="#a67c00" stroke-width="1"/>
    </g>
  </g>
  <!-- vs boom -->
  <text x="64" y="28" text-anchor="middle" font-size="16" font-family="sans-serif">⚔️</text>
</svg>
